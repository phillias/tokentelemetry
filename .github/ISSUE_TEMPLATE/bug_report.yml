name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is broken, and where?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know the fix works?
    validations:
      required: true
  - type: textarea
    id: reversion
    attributes:
      label: Reversion actions
      description: How to roll back or mitigate if the fix causes harm?
    validations:
      required: false
